name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate.mjs
      - name: Package skills (skill folder at zip root)
        run: |
          mkdir -p dist
          (cd skills && zip -r ../dist/sales-demo.zip sales-demo)
          (cd skills && zip -r ../dist/sales-memory.zip sales-memory)
          (cd skills && zip -r ../dist/crm-setup.zip crm-setup)
          unzip -l dist/sales-demo.zip | grep -q "sales-demo/SKILL.md"
          unzip -l dist/sales-memory.zip | grep -q "sales-memory/references/conventions.md"
          unzip -l dist/crm-setup.zip | grep -q "crm-setup/references/connect-crm.md"
      - name: Create release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME"
